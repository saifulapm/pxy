#    seen at 497/32). ultra-550b answers slowly (>60s with reasoning), and
#    muse-glimmer returns a 500 rather than a 400 once its window is exceeded.
#    ⚠️ context_length here is measured against the LIVE API (oversized probe →
#    NIM states its own ceiling), NOT build.nvidia.com: that page's spec panel
