# ZenMux — has 8 zero-priced models (catalog probe 2026-08-24), notably
# z-ai/glm-5.3-free with 1M context. NOTE: current key returns 403 on ALL
# generation calls (verified independently via OmniRoute too) — the account
# needs a new key or re-verification at zenmux.ai. Kept out of [auto] until
# the key works.
# UPDATE 2026-08-24: new key + $5 balance -> all free models verified working.
[providers.zenmux]
base_url = "https://zenmux.ai/api/v1/chat/completions"
api_key = { pass = "AI/zenmux/main" }
models = [
  { id = "z-ai/glm-5.3-free", context_length = 1000000 },
  { id = "deepseek/deepseek-v4-flash-vision-exp-free", context_length = 1000000 },
  { id = "sapiens-ai/agnes-2.5-flash", context_length = 524288 },
