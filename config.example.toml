# pxy example config.
#
# This file is a REFERENCE, not a working setup: every provider, model id and
# URL below is fictional. Copy the blocks you need into
# ~/.config/pxy/config.toml and edit them.
#
# config.toml is the whole catalog. A model is served exactly when a provider
# below declares it under `models = [...]`. `models.toml` (written by
# `pxy refresh --generate`) is a discovery report pxy never reads.
#
# The parser is strict: an unknown key fails startup with `unknown field`.
# That is deliberate, so a typo cannot silently do nothing.

# ---------------------------------------------------------------------------
# Top level
# ---------------------------------------------------------------------------

# Provider allowlist. Empty or absent exposes every enabled provider.
# Non-empty exposes ONLY these, to the pickers, the group chains and routing
# alike. An entry matches a provider by exact name or as a Family Prefix:
# "opencode-go" covers "opencode-go-github", never the unrelated "google".
# An entry that matches nothing is a hard error (a typo would otherwise shrink
# the catalog silently).
providers_whitelist = []

[server]
# Binds 127.0.0.1 only. `api_key` is a soft gate: no endpoint checks it. It
# rides `pxy launch` so per-agent usage can be attributed.
port = 4100
api_key = "pxy-local"

[launch]
# Default model for `pxy launch <agent>`: usually a group name.
model = "daily"
# Cheap model for agents that ask for one (Claude Code's haiku slot).
small_model = "fast"

# Opt-in request artifact capture for translation debugging. Off by default,
# bounded, and secret-masked before anything touches disk.
[capture]
enabled = false
# errors only: write artifacts only for failed attempts. Volume then tracks
# problems, not traffic. This is the mode to leave on.
on_error = true
# Default: $XDG_DATA_HOME/pxy/captures
# dir = "/home/you/.local/share/pxy/captures"
max_bytes = 262144
max_files = 500
max_age_secs = 86400

# Server tools pxy runs itself. A client declares one by its `type`; pxy offers
# the model a reserved function, runs the call and feeds the result back in the
# same turn. The client implements nothing. Types served today:
# openrouter:web_search, pxy:web_search, web_search_20250305, web_search_preview.
[server_tools]
# Which tools may be served. A tool missing from this list is treated as
# unservable: dropped on a multi-candidate walk, or the request refused on a
# single candidate. Default: every tool pxy implements.
enabled = ["web_search"]
# Tool-call steps allowed in one turn. A request-level `max_tool_calls`
# overrides it; a tool's own per-call cap still wins for that tool.
max_tool_calls = 10
# Fusion: a panel of models answers the same prompt at once and one analyst
# compares their answers. Both are model ids or group names, in answer order.
# The panel is empty by default, so `fusion` is unservable until you name one;
# the analyst defaults to the first panel member.
# fusion_panel = ["aaa", "glm"]
# fusion_analyst = "aaa"
# Tools declared on every client turn, as if the client had sent them, so no
# harness needs a plugin to get them. Each table is the tool's `parameters`
# (the OpenRouter names); an empty table declares the tool with none. A client
# that declares the tool itself keeps its own declaration. Best effort: a
# default the turn cannot use (no search pool, a dialect without the tool, an
# Anthropic-format upstream, a model that cannot tool-call) is left out.
# [server_tools.defaults.datetime]
# [server_tools.defaults.web_search]
# max_results = 5
# [server_tools.defaults.advisor]
# model = "aaa"
# instructions = "You are a senior engineer. Be decisive."

# ---------------------------------------------------------------------------
# Groups: named failover chains. A group name is itself a routable model id.
# Walk order is the order of `models` below.
# ---------------------------------------------------------------------------

[groups.daily]
# What pickers show instead of the raw key.
name = "Daily"
# Ordered candidates, "provider/model". Each entry is verified to do tool
# calling, providers are interleaved so one provider's 429 does not stall the
# chain, and the scarcest allowance goes last.
models = [
  "alpha/model-large",
  "beta/model-large",
  "gamma/model-large",
]
# Assert extended thinking for the WHOLE chain, overriding the per-member
# rule (every member `reasoning = true`, else the group offers nothing).
# Use only when a member cannot be probed but you know the chain thinks.
reasoning = true
# Free-first chain with a paid reserve: reach a paid step only when every
# prior failure was genuine quota exhaustion (a 402 or a quota-named 429). A
# transient 5xx, timeout, auth error or rpm throttle holds the reserve.
# A candidate counts as paid unless its model sets `free = true`.
fallback_only_on_quota_exhaustion = false
# Rank this chain by remaining LOCAL allowance before walking it (more
# headroom first, ties keep config order). Needs no network.
headroom = false

[groups.fast]
name = "Fast"
models = ["alpha/model-small"]

# ---------------------------------------------------------------------------
# Providers
# ---------------------------------------------------------------------------

# A single-key OpenAI-format provider, showing every chat option.
[providers.alpha]
# Wire format of base_url: "openai" (default) or "anthropic".
format = "openai"
# COMPLETE endpoint URL, not a host.
base_url = "https://api.alpha.example/v1/chat/completions"
# Secret forms, in one place:
#   api_key = { pass = "AI/alpha/main" }   # pass show, body verbatim
#   api_key = { env = "ALPHA_KEY" }
#   api_key = { cmd = "print-key-command" }
#   api_key = "literal-key"
api_key = { pass = "AI/alpha/main" }
# Alternative spelling of api_key (a credential blob). Mutually exclusive with
# `accounts`, and with api_key.
# credentials = { pass = "AI/alpha/creds" }
# Extra headers sent to the upstream.
headers = { X-Title = "pxy" }
# Credential header: "bearer" (default), "x-api-key", "xi-api-key".
auth_header = "bearer"
enabled = true
timeout_secs = 600
# Lift literal <think>...</think> tags out of responses into reasoning.
# Default true, and only ever applied to OpenAI-format upstreams: a false
# negative leaks raw tags into the client, which the agent then replays.
parse_think_tags = true
# Top-level request-body keys this upstream 400s on. Removed after
# translation, just before the wire. Per-model `drop_params` adds to it.
drop_params = ["top_k", "stream_options.include_usage"]
# Anthropic prompt-cache breakpoints for OpenAI-dialect clients that cannot
# set them. Off by default: several gateways 400 on the field, and relay must
# be proven before enabling.
inject_cache_control = false
# True only for OpenAI/Azure itself: their reasoning models reject `system`
# and require `max_completion_tokens`. Off means pxy normalizes those two
# spellings to what most compatible gateways accept.
openai_native = false
# True for DeepSeek-style thinking APIs that reject a tool turn whose
# assistant message carries no reasoning.
requires_reasoning_replay = false
# Include this provider in `pxy refresh` discovery. Default true.
discover = true
# Only needed when the models list cannot be derived from base_url.
# models_url = "https://api.alpha.example/v1/models"
# Field holding the usable id. Default "id"; Cloudflare's `id` is a UUID, so
# its real id lives in "name".
# id_field = "name"
# Remote billing for `pxy status --remote`.
# balance_url = "https://api.alpha.example/v1/credits"
# A credential for balance_url when it differs from the chat key, sent RAW in
# Authorization (no `Bearer`).
# balance_key = { pass = "AI/alpha/manage" }

# Models: a bare id, or a table to set facts. model ids are the upstream's.
models = [
  # Bare id: default context_length 128000, max_output_tokens 16384.
  "model-small",
  { id = "model-large" },
  # Every ModelSpec key, annotated.
  { id = "model-thinking",
    name = "Model Thinking",            # display name
    context_length = 200000,
    max_output_tokens = 32000,
    # Per-model wire-format override, for a provider serving both dialects.
    # format = "anthropic",
    # Asserted capabilities. `tool_call = false` IS read by routing: the model
    # is skipped on a tools walk. Omit to fail open.
    tool_call = true,
    # `free` and `reasoning` are display/capability metadata; routing never
    # reads them.
    free = false,
    reasoning = true,
    # The thinking levels this model accepts, in canonical order:
    # none, minimal, low, medium, high, xhigh, max.
    effort = ["low", "high", "max"],
    # Always stream upstream, even for a non-streaming client; pxy collects
    # the stream and returns ordinary JSON.
    force_stream = false,
    # Per-model body keys, additive to the provider's.
    drop_params = ["reasoning_effort"],
  },
]

# Body-matched error overrides. FIRST rule whose `match` is a case-insensitive
# substring of the error body wins over the status ladder. Actions:
#   skip, skip-cooldown, passthrough, passthrough-cooldown
# (`passthrough*` returns the raw upstream error to the client; `-cooldown`
# also sets a model-scoped retryable cooldown.)
[[providers.alpha.errors]]
match = "no channel available"
action = "skip-cooldown"

# Limits, enforced locally against pxy's own counters. Omit for no limits.
[providers.alpha.limits]
rpm = 20                                  # sliding 60s window
daily_requests = 1000
daily_tokens = 2000000
monthly_requests = 0                      # omit or 0 for unlimited
monthly_tokens = 0
total_requests = 0                        # all-time budget, never resets
total_tokens = 0
reset = "00:00"                           # daily window start, "HH:MM"
reset_tz = "UTC"                          # IANA zone for daily/monthly windows

# An Anthropic-format provider using a credential blob and a custom auth header.
[providers.beta]
format = "anthropic"
base_url = "https://api.beta.example/v1/messages"
credentials = { pass = "AI/beta/creds" }
auth_header = "x-api-key"
models = [
  { id = "model-large", context_length = 200000, max_output_tokens = 32000, reasoning = true },
]

# One provider entry holding several subscriptions, fill-first: account 1 is
# used until it is cooling or over its limits. State is tracked per account.
# `accounts` is mutually exclusive with top-level api_key/credentials.
[providers.gamma]
base_url = "https://api.gamma.example/v1/chat/completions"
models = [
  { id = "model-large", context_length = 200000, reasoning = true },
]
[providers.gamma.limits]
rpm = 30
[[providers.gamma.accounts]]
name = "primary"                          # [a-z0-9-], part of the state key
api_key = { pass = "AI/gamma/primary" }
# headers override the provider's same-named ones for this account.
# headers = { X-Org = "team-a" }
[[providers.gamma.accounts]]
name = "secondary"
api_key = { pass = "AI/gamma/secondary" }
# A second credential blob form is also legal per account.
# credentials = { pass = "AI/gamma/secondary-creds" }

# ---------------------------------------------------------------------------
# Media: non-chat capabilities. Usage is counted under "provider#media" and
# never against chat limits. `kind` picks the wire dialect (see below).
# ---------------------------------------------------------------------------

[providers.gamma.media]
kind = "openai"
images_url = "https://api.gamma.example/v1/images/generations"
image_models = ["image-one"]
# Fields merged into image requests when absent.
image_defaults = { size = "1K" }
transcription_url = "https://api.gamma.example/v1/audio/transcriptions"
transcription_models = ["stt-one"]
speech_url = "https://api.gamma.example/v1/audio/speech"
speech_models = ["tts-one"]
# Voice name -> provider voice id. "default" is used when the request has no
# voice; an unmapped name passes through.
voices = { default = "voice-1", nova = "voice-2" }
rerank_url = "https://api.gamma.example/v1/rerank"
rerank_models = ["rerank-one"]
video_url = "https://api.gamma.example/v1/videos/generations"
# Poll URL for the submit-then-poll flow; "{id}" is the job id. Required for
# video, and a provider without it is kept out of any video chain.
video_status_url = "https://api.gamma.example/v1/videos/{id}"
video_models = ["video-one"]
# Media-only daily cap, counted separately from chat usage. Billing safety for
# providers whose overage costs money.
daily_requests = 30

# Media-only provider, Cloudflare-style run endpoint: all capabilities share
# `run_url` unless a specific URL overrides it.
[providers.delta]
[providers.delta.media]
kind = "cloudflare"
run_url = "https://api.delta.example/run/{model}"
image_models = ["image-one"]
transcription_models = ["stt-one"]
speech_models = ["tts-one"]
daily_requests = 30

# Embeddings-only provider: no base_url needed, kept out of the chat catalog.
[providers.epsilon]
embeddings_url = "https://api.epsilon.example/v1/embeddings"
embedding_models = ["embed-one", "embed-two"]
api_key = { pass = "AI/epsilon/main" }

# ElevenLabs-style native TTS/STT. The credential header is provider-specific.
[providers.zeta]
api_key = { pass = "AI/zeta/main" }
auth_header = "xi-api-key"
[providers.zeta.media]
kind = "elevenlabs"
speech_url = "https://api.zeta.example/v1/text-to-speech/{voice}"
speech_models = ["tts-one"]
transcription_url = "https://api.zeta.example/v1/speech-to-text"
transcription_models = ["stt-one"]
voices = { default = "voice-1" }

# Voyage-style rerank (top_k / data[] instead of top_n / results[]).
[providers.eta]
api_key = { pass = "AI/eta/main" }
embeddings_url = "https://api.eta.example/v1/embeddings"
embedding_models = ["embed-one"]
[providers.eta.media]
kind = "voyage"
rerank_url = "https://api.eta.example/v1/rerank"
rerank_models = ["rerank-one"]

# Agnes-style images plus an async video job (submit, then poll).
[providers.theta]
api_key = { pass = "AI/theta/main" }
[providers.theta.media]
kind = "agnes"
images_url = "https://api.theta.example/v1/images"
image_models = ["image-one"]
image_defaults = { size = "1K" }
video_url = "https://api.theta.example/v1/videos"
video_status_url = "https://api.theta.example/status?video_id={id}"
video_models = ["video-one"]

# DashScope-style multimodal-generation: images, TTS and ASR on one URL.
[providers.iota]
api_key = { pass = "AI/iota/main" }
[providers.iota.media]
kind = "dashscope"
run_url = "https://api.iota.example/api/v1/services/aigc/multimodal-generation/generation"
image_models = ["image-one"]
speech_models = ["tts-one"]
transcription_models = ["stt-one"]
voices = { default = "voice-1" }

# Meta-style: chat over Anthropic, plus a media block whose ASR takes a
# `request` JSON part beside the audio bytes.
[providers.kappa]
format = "anthropic"
base_url = "https://api.kappa.example/v1/messages"
api_key = { pass = "AI/kappa/main" }
models = [{ id = "chat-one", context_length = 200000, reasoning = true }]
[providers.kappa.media]
kind = "meta"
images_url = "https://api.kappa.example/v1/images/generations"
image_models = ["image-one"]
transcription_url = "https://api.kappa.example/v1/asr/transcribe"
transcription_models = ["stt-one"]

# The remaining media kinds, as copy-paste fragments for a provider you already
# have:
#
#   kind = "openai"     OpenAI images/audio + Cohere rerank, passed through
#   kind = "cloudflare" Workers AI run endpoint, JSON or binary per task
#   kind = "elevenlabs" native TTS/STT, auth_header = "xi-api-key"
#   kind = "voyage"     rerank with top_k / data[]
#   kind = "agnes"      OpenAI-ish images + async video job
#   kind = "dashscope"  Alibaba multimodal-generation on one URL
#   kind = "meta"       OpenAI images, ASR with a `request` part

# ---------------------------------------------------------------------------
# Search and fetch: ordered service-provider pools, first healthy wins, with
# their own local quota guards.
# ---------------------------------------------------------------------------

[[search.providers]]
name = "search-one"
kind = "brave"                            # brave | jina | firecrawl-search
api_key = { pass = "AI/search/one" }
daily_requests = 1900
monthly_requests = 0
enabled = true

[[search.providers]]
name = "search-two"
kind = "jina"
api_key = { pass = "AI/search/two" }

[[fetch.providers]]
name = "reader-one"
kind = "jina-reader"                      # jina-reader | firecrawl-scrape
api_key = { pass = "AI/fetch/one" }

[[fetch.providers]]
name = "reader-two"
kind = "firecrawl-scrape"
api_key = { pass = "AI/fetch/two" }

# ---------------------------------------------------------------------------
# Default model per media capability, used when a request omits `model` or
# asks for "auto". One id, or an ordered failover chain.
# ---------------------------------------------------------------------------

[media]
image = "gamma/image-one"
transcription = "delta/stt-one"
speech = ["gamma/tts-one", "zeta/tts-one"]
rerank = "eta/rerank-one"
video = "theta/video-one"
