  { id = "inclusionai/ling-3.0-tiny", context_length = 262144 },
]

# Mistral La Plateforme — free "Experiment" plan (phone-verified, data-training
# opt-in). Official limits only visible in admin.mistral.ai console; community
# figures: ~1 req/sec, generous monthly tokens. 429s handled by failover.
[providers.mistral]
base_url = "https://api.mistral.ai/v1/chat/completions"
api_key = { pass = "AI/mistral/main" }
models = [
  "devstral-latest",
  "devstral-medium-latest",
  "mistral-large-latest",
  "magistral-medium-latest",
  "mistral-small-latest",
]
[providers.mistral.limits]
rpm = 30

# Codestral dedicated endpoint — SEPARATE key from api.mistral.ai, currently
# free (phone-verified). Aimed at IDE/FIM use; also serves chat.
[providers.codestral]
base_url = "https://codestral.mistral.ai/v1/chat/completions"
api_key = { pass = "AI/codestral/main" }
models = ["codestral-latest", "codestral-2508"]
[providers.codestral.limits]
rpm = 30

# Alibaba Model Studio intl (global account; free quota ACTIVE 2026-08-24).
# Each Qwen model has its own 1M-token free quota, valid 90 days from
# activation — after that calls bill pay-as-you-go UNLESS "Free Quota Only"
# is enabled in the console (recommended!). Non-Qwen models (kimi/glm/
# deepseek) are paid — deliberately not listed here. The china account is
# not activated (AccessDenied.Unpurchased) — parked.
[providers.alibaba]
base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1/chat/completions"
embeddings_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1/embeddings"
api_key = { pass = "AI/alibaba/global" }
models = [
  "qwen3.8-max",
  "qwen3.8-2.4t-a95b",
  "qwen3.7-plus",
  "qwen3.7-flash",
  "qwen3.8-27b",
]
embedding_models = ["qwen3.7-text-embedding"]
[providers.alibaba.limits]
total_tokens = 5000000        # 5 chat models x 1M free quota (90-day expiry!)

# Fireworks — PAID serverless (pay per token; $1 signup credit only, 10 rpm
# without a payment method). Kept OUT of [auto] deliberately: it spends real
# money. Cheap picks: gpt-oss-120b $0.15/$0.60 per M, deepseek-v4-flash
# $0.14/$0.28. Fully-qualified model ids required.
[providers.fireworks]
base_url = "https://api.fireworks.ai/inference/v1/chat/completions"
embeddings_url = "https://api.fireworks.ai/inference/v1/embeddings"
api_key = { pass = "AI/fireworks/main" }
models = [
  "accounts/fireworks/models/gpt-oss-120b",
  "accounts/fireworks/models/deepseek-v4-flash-0731",
  "accounts/fireworks/models/glm-5p2",
  "accounts/fireworks/models/kimi-k3",
  "accounts/fireworks/models/kimi-k2p7-code",
  "accounts/fireworks/models/qwen3p8-max",
]
embedding_models = ["accounts/fireworks/models/qwen3-embedding-8b"]
[providers.fireworks.limits]
rpm = 10

# agentrouter speaks Anthropic messages natively (docs/06). Its WAF rejects
# unknown clients ("unauthorized client detected") — a claude-cli User-Agent
# is the minimal passing fingerprint (probed 2026-08-24). PAID balance
# (prepaid credits) — kept OUT of [auto]; premium manual-use reserve.
[providers.agentrouter]
format = "anthropic"
base_url = "https://agentrouter.org/v1/messages"
auth_header = "x-api-key"
api_key = { pass = "AI/agentrouter/main" }
headers = { User-Agent = "claude-cli/2.1.241 (external, cli)" }
models = [
  { id = "claude-opus-5", context_length = 200000, max_output_tokens = 64000 },
  { id = "claude-opus-4-8", context_length = 200000, max_output_tokens = 64000 },
]

# gpt-5.6-sol is OpenAI-endpoint-only; deepseek-v4f also lives here because
# agentrouter's Anthropic route rejects it unless stream=true (probed).
[providers.agentrouter-openai]
base_url = "https://agentrouter.org/v1/chat/completions"
api_key = { pass = "AI/agentrouter/main" }
headers = { User-Agent = "claude-cli/2.1.241 (external, cli)" }
models = [
  { id = "gpt-5.6-sol", context_length = 272000 },
  { id = "deepseek-v4f", context_length = 128000 },
]

# TokenRouter — aggregator with 128 models; only 2 are FREE (verified
# 2026-08-24). Rate limits are undocumented and it returns no ratelimit
# headers; concurrency probing showed sporadic 503s, so keep rpm modest and
# rely on failover. total_usage on this account is $0 — free models only here.
[providers.tokenrouter]
base_url = "https://api.tokenrouter.com/v1/chat/completions"
api_key = { pass = "AI/tokenrouter/main" }
models = [
  { id = "qwen/qwen3.8-max-free", context_length = 262144 },
  { id = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free", context_length = 256000 },
]
[providers.tokenrouter.limits]
rpm = 10

# OpenAdapter — FREE plan: 50 requests/day, 200/month (per their dashboard).
# Quota consumed is echoed on every response as X-Quota-5h / X-Quota-Week /
# X-Quota-Month percentages. The whole `free/*` namespace and all top-tier
# models are PAID-plan only (their "free/" prefix means free-*experimental*,
# not free-to-you); only these 5 small models are callable — probed 2026-08-24.
[providers.openadapter]
base_url = "https://api.openadapter.in/v1/chat/completions"
api_key = { pass = "AI/openadapter/main" }
models = [
  { id = "0GM-1.0-35B-A3B", context_length = 128000 },
  { id = "Gemma-4-31B-TEE", context_length = 128000 },
  { id = "GPT-20-OSS", context_length = 128000 },
  { id = "Gemma-3-12B", context_length = 128000 },
  { id = "Llama-3.1-8B", context_length = 128000 },
]
[providers.openadapter.limits]
daily_requests = 50
monthly_requests = 200
rpm = 5

# Agnes AI — balance is $0, but the *flash* tier still answers free
# (pro tiers return "用户额度不足" / insufficient balance). Probed 2026-08-24.
# Also hosts image/video models (agnes-image-*, agnes-video-*) for Phase 2.
[providers.agnes]
base_url = "https://apihub.agnes-ai.com/v1/chat/completions"
api_key = { pass = "AI/agnes/main" }
models = [
  { id = "agnes-2.5-flash", context_length = 128000 },
  { id = "agnes-2.0-flash", context_length = 128000 },
]
[providers.agnes.limits]
rpm = 10

# b.ai — 42 models (Claude/GPT/Gemini/GLM/Qwen), nearly all deposit-gated
# ("Access restricted. Deposit required to unlock premium models"). Full
# catalog sweep 2026-08-24 found exactly ONE model usable at zero balance:
