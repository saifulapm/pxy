# Google AI Studio (Gemini): DONE — served by [providers.google] above via
# Google's OpenAI compat layer (/v1beta/openai/); no Gemini translator needed.
# (This note previously claimed one was required — that was wrong.)
# ---------------------------------------------------------------------------
# Phase 2 (2026-08-25): non-chat capabilities.
# Endpoints: /v1/images/generations, /v1/audio/transcriptions,
# /v1/audio/speech, /v1/rerank, /v1/videos/generations, /v1/search, /v1/fetch.
# CLI: pxy search / fetch / transcribe / say / image / video.
# Media usage + cooldowns are tracked under <provider>#media, search/fetch
# under search#<name> / fetch#<name> — never mixed with chat counters.
# ---------------------------------------------------------------------------

# ElevenLabs — media only. Free tier: 10k credits/month (TTS chars; STT
# included). Library voices 402 on free — only premade voice ids work, hence
# the map (keys mirror OpenAI voice names; "default" = Sarah).
[providers.elevenlabs]
api_key = { pass = "AI/elevenlabs/main" }
auth_header = "xi-api-key"
discover = false
[providers.elevenlabs.media]
kind = "elevenlabs"
transcription_url = "https://api.elevenlabs.io/v1/speech-to-text"
transcription_models = ["scribe_v1"]
speech_url = "https://api.elevenlabs.io/v1/text-to-speech/{voice}"
speech_models = ["eleven_turbo_v2_5", "eleven_multilingual_v2"]
[providers.elevenlabs.media.voices]
default = "EXAVITQu4vr4xnSDxMaL"   # Sarah
alloy = "SAz9YHcvj6GT2YYXdXww"     # River
echo = "IKne3meq5aSn9XLyUdCD"      # Charlie
fable = "JBFqnCBsd6RMkjVDRZzb"     # George
onyx = "CwhRBWXzGAHq8TQ4Fs17"      # Roger
nova = "FGY2WhTYpPnrIDTdsKH5"      # Laura
shimmer = "Xb7hH8MSUJpSbSDYk0k2"   # Alice

# Voyage — embeddings + rerank (generous free token allowance per model).
# Rerank dialect: top_k in, data[] out — pxy maps to/from Cohere shape.
[providers.voyage]
api_key = { pass = "AI/voyage-ai/main" }
discover = false
embeddings_url = "https://api.voyageai.com/v1/embeddings"
embedding_models = ["voyage-3.5-lite", "voyage-3.5", "voyage-code-3"]
[providers.voyage.media]
kind = "voyage"
rerank_url = "https://api.voyageai.com/v1/rerank"
rerank_models = ["rerank-2.5-lite", "rerank-2.5"]

# Jina — rerank (Cohere-compatible passthrough). Same key as jina-reader.
[providers.jina]
api_key = { pass = "AI/jina-reader/main" }
discover = false
[providers.jina.media]
rerank_url = "https://api.jina.ai/v1/rerank"
rerank_models = ["jina-reranker-v2-base-multilingual"]

# Default per capability (requests with model omitted or "auto"). Each value
# is one id OR an ordered failover chain — first healthy (not cooling down,
# under its media cap) wins, provider-side failures walk to the next entry.
# A bare `provider/model` request stays single-candidate: its errors pass
# through raw.
[media]
image = ["cloudflare/@cf/black-forest-labs/flux-1-schnell", "agnes/agnes-image-2.1-flash"]
transcription = ["groq/whisper-large-v3-turbo", "mistral/voxtral-mini-latest"]
speech = "cloudflare/@cf/deepgram/aura-2-en"
rerank = ["voyage/rerank-2.5-lite", "jina/jina-reranker-v2-base-multilingual"]
video = "agnes/agnes-video-v2.0"

# Web search, priority order. Brave free = 2,000 q/month (cap with margin);
