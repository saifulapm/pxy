# 5) Groq — ACTIVE 2026-08-25 as a SHORT-CALL sidecar, NEVER in [auto].
#    Verified from live headers: gpt-oss/qwen = 1000 req/day but 8K TPM —
#    context_length below is set to 8192 ON PURPOSE so pxy rejects bigger
#    requests locally instead of upstream request_too_large. compound(-mini)
#    = 250 req/day, 70K TPM, built-in web search/code-exec; REJECTS external
#    tools ("tool calling is not supported"), so ask it questions directly.
#    ~3000 tok/s. No card on the account = hard 429 stop, no billing risk.
# Kiro (AWS CodeWhisperer) — Phase 3 #3, ACTIVE 2026-08-25. kind = kiro
# (providers/kiro.rs + translate/kiro.rs): social-login refresh at
# prod.us-east-1.auth.desktop.kiro.dev, conversationState request bodies, and
# vnd.amazon.eventstream binary responses decoded back to SSE. base_url and
# profileArn are derived at runtime from the ARN in the credential, so the
# region follows the profile automatically.
# FREE plan: 50 credits/month, resets the 1st (verified via GetUsageLimits).
# Overage is DISABLED + OVERAGE_INCAPABLE on this account => cannot bill.
# Model ids MUST match the account's live catalog or Kiro 400s; these came
# from ListAvailableModels. Credit cost scales with rateMultiplier, so the
# cheap models go a very long way (qwen3-coder-next 0.05x, minimax-m2.1 0.15x,
# deepseek-3.2/minimax-m2.5 0.25x, haiku 0.4x, glm-5 0.5x, sonnet-4.5 1.3x).
# NOT in [auto]: 50 credits/month is scarcer than every free pool above.
[providers.kiro]
tier = "finite"
kind = "kiro"
format = "kiro"
credentials = { pass = "AI/kiro/main" }
models = [
  { id = "claude-sonnet-4.5", context_length = 200000, max_output_tokens = 64000 },
  { id = "claude-haiku-4.5", context_length = 200000, max_output_tokens = 64000 },
  { id = "qwen3-coder-next", context_length = 256000 },
  { id = "glm-5", context_length = 200000 },
  { id = "deepseek-3.2", context_length = 164000 },
  { id = "minimax-m2.5", context_length = 196000 },
]
[providers.kiro.limits]
monthly_requests = 400        # ~50 credits at the cheap models' multipliers
reset = "00:00"
reset_tz = "UTC"

# Kimi coding tier — Phase 3 #2, ACTIVE 2026-08-25 (kind = kimi-coding in
# providers/kimi.rs). ROTATING refresh tokens: the live credential lives in
# state.sqlite kv (kimi_token:kimi-coding) after the first refresh; pass holds
# only the login-time bootstrap + device identity. If state.sqlite is lost, a
# fresh device-flow login is needed (pxy has no login flow yet — device flow
# via curl works: POST auth.kimi.com/api/oauth/device_authorization with
# client_id + X-Msh-* headers, then poll the token endpoint). Speaks Anthropic
# natively (x-api-key, ?beta=true). Free coding tier: weekly + rolling-window
# quotas (403s can be EITHER — see docs/06 quota note).
# STATUS 2026-08-25: account credits EXHAUSTED ("Credits used up" from
# /coding/v1/usages) — chat + /models return bare 500s while in this state
# (Kimi's error hygiene is poor). Auth/refresh verified working end-to-end.
# Keep OUT of [auto] until a quota reset makes calls succeed.
[providers.kimi-coding]
tier = "finite"
kind = "kimi-coding"
format = "anthropic"
credentials = { pass = "AI/kimi-coding/main" }
models = [
  { id = "k3", context_length = 1048576 },
  { id = "kimi-for-coding", context_length = 262144 },
  { id = "kimi-for-coding-highspeed", context_length = 262144 },
]

# Kilo Code gateway — Phase 3 #1, ACTIVE 2026-08-25, and it needed ZERO Rust:
# the device-flow token archived in pass is a long-lived JWT (exp ~2031, no
# refresh), so runtime is a plain bearer + the mandatory X-KILOCODE-EDITORNAME
# header. The `cmd` secret extracts the token from the archived OAuth JSON.
# Free tier: 17 `:free` models (tool calling verified on 4); paid models
# refuse cleanly ("Add credits to continue") — zero billing risk. The
# `kilo-auto/free` router id errors — use concrete model ids. Rate limits
# undocumented; rpm kept modest, 429s handled by cooldown/failover.
[providers.kilocode]
base_url = "https://api.kilo.ai/api/openrouter/chat/completions"
api_key = { cmd = "pass show 'AI/kilocode/saiful.apm@gmail.com' | jq -r .access_token" }
headers = { X-KILOCODE-EDITORNAME = "pxy" }
models = [
  { id = "tencent/hy3:free", context_length = 262144 },
  { id = "minimax/minimax-m3:free", context_length = 1048576 },
  { id = "nvidia/nemotron-3-ultra-550b-a55b:free", context_length = 1000000 },
  { id = "meituan/longcat-2.0-free", context_length = 1048576 },
  { id = "poolside/laguna-s-2.1:free", context_length = 262144 },
  { id = "stepfun/step-3.7-flash:free", context_length = 262144 },
  { id = "thinkingmachines/inkling:free", context_length = 1048576 },
]
[providers.kilocode.limits]
rpm = 15

# Google AI Studio (Gemini API) — free tier, ACTIVE 2026-08-25. docs/08 said
# this needs a Gemini translator: WRONG (3rd correction) — Google's OpenAI
# compatibility layer (/v1beta/openai/) does chat + tool calling fine.
# Free tier = no billing on the project -> hard 429 stop past quota, no
# billing risk. Google doesn't publish free per-model limits; rpm kept low,
# upstream 429s handled by cooldown/failover. ⚠️ free tier TRAINS on prompts.
# Key line 1 of pass entry, project number line 2 (project 416746239844).
[providers.google]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
api_key = { pass = "AI/google/main" }
models = [
  { id = "gemini-3-flash-preview", context_length = 1048576, tool_call = true },
  { id = "gemini-3.1-flash-lite", context_length = 1048576 },
  { id = "gemini-2.5-flash", context_length = 1048576 },
]
[providers.google.limits]
rpm = 8

[providers.groq]
base_url = "https://api.groq.com/openai/v1/chat/completions"
api_key = { pass = "AI/groq/main" }
models = [
  { id = "openai/gpt-oss-120b", context_length = 8192 },
  { id = "openai/gpt-oss-20b", context_length = 8192 },
  { id = "qwen/qwen3.6-27b", context_length = 8192 },
  { id = "groq/compound", context_length = 65536 },
  { id = "groq/compound-mini", context_length = 65536 },
]
[providers.groq.limits]
rpm = 25
daily_requests = 1000
# Groq whisper: the best free STT we hold (generous daily quota, very fast).
# Plain OpenAI multipart. NB groq infers the format from the FILENAME — a
# file part without a real extension is rejected.
[providers.groq.media]
transcription_url = "https://api.groq.com/openai/v1/audio/transcriptions"
transcription_models = ["whisper-large-v3-turbo", "whisper-large-v3"]

