# Cloudflare Workers AI — Workers PAID plan: 10k neurons/day free allocation,
# then $0.011/1k neurons billed AUTOMATICALLY (Cloudflare has no block-at-limit
# switch), so the guard is client-side: daily_tokens 50k across only cheap
# models (output <= $1.32/M) is worst-case ~6k neurons ≈ 60% of the free
# allocation — never bills. kimi-k2.7-code and glm-5.2 deliberately EXCLUDED
# ($4+/M output would blow the allocation). KEEP OUT of [auto]: agentic
# traffic would eat the cap instantly; manual/overflow use only.
# Account id from the old OmniRoute db (provider_connections). Tool calling
# verified on all included models 2026-08-25.
[providers.cloudflare]
tier = "reserve"
base_url = "https://api.cloudflare.com/client/v4/accounts/0a937759fca2672765c005345aebe060/ai/v1/chat/completions"
api_key = { pass = "AI/cloudflare-ai/main" }
# Discovery: the OpenAI-compat path has no /models, and in the real listing
# `id` is a UUID while `name` (@cf/vendor/model) is what you call.
models_url = "https://api.cloudflare.com/client/v4/accounts/0a937759fca2672765c005345aebe060/ai/models/search?per_page=200&task=Text%20Generation"
id_field = "name"
models = [
  { id = "@cf/openai/gpt-oss-120b", context_length = 128000 },
  { id = "@cf/deepseek-ai/deepseek-v4-flash-0731", context_length = 1310720 },
  { id = "@cf/zai-org/glm-4.7-flash", context_length = 131072 },
  { id = "@cf/meta/llama-4-scout-17b-16e-instruct", context_length = 131000 },
  { id = "@cf/google/gemma-4-26b-a4b-it", context_length = 256000 },
]
[providers.cloudflare.limits]
rpm = 10
daily_tokens = 50000
# Workers AI media through the run endpoint. SAME billing caveat as chat:
# past 10k neurons/day it bills automatically, so the media pool has its own
# hard daily cap (counted under cloudflare#media, separate from chat tokens).
# flux-1-schnell + whisper turbo + aura-2 verified live 2026-08-25; melotts
# was 500ing upstream (retest); SDXL answers raw PNG bytes (handled).
[providers.cloudflare.media]
kind = "cloudflare"
run_url = "https://api.cloudflare.com/client/v4/accounts/0a937759fca2672765c005345aebe060/ai/run/{model}"
image_models = [
  "@cf/black-forest-labs/flux-1-schnell",
  "@cf/bytedance/stable-diffusion-xl-lightning",
]
transcription_models = ["@cf/openai/whisper-large-v3-turbo"]
speech_models = ["@cf/deepgram/aura-2-en", "@cf/myshell-ai/melotts"]
daily_requests = 30

# opencode Zen: pay-per-token gateway sharing the Go workspace key.
# The *-free models cost nothing (limited time; NVIDIA ones are trial-only —
# don't send personal data; muse-spark trains on prompts).
# Every model here is a reasoning model (deepseek/hy3/mimo/nemotron/laguna).
# opencode usually returns the chain-of-thought in `reasoning_content`, but a
# `</think>` has been seen leaking into a Claude Code transcript from
# deepseek-v4-flash, so parse the tags out of content too — a no-op on the
# responses that use the field properly.
[providers.opencode-zen]
tier = "subscription"
base_url = "https://opencode.ai/zen/v1/chat/completions"
api_key = { pass = "AI/opencode-go/github" }
parse_think_tags = true
models = [
  "big-pickle",
