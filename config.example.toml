# pxy example config — copy to ~/.config/pxy/config.toml and edit.
# Secrets come from `pass` (entries under AI/, see docs/01-provider-inventory.md).
# Model ids below are real (sampled from the OmniRoute catalog, 2026-08-24) —
# trim/extend per provider as you like. `pxy models` lists what's exposed.

[server]
port = 4100
api_key = "pxy-local"   # soft gate; server binds 127.0.0.1 only

# ---------------------------------------------------------------------------
# The auto chain: ordered priority. First provider with limit headroom and no
# cooldown wins; failures/limits walk down the list.
# ---------------------------------------------------------------------------
[auto]
# Ordered priority. pxy skips candidates in cooldown / over limits / with too
# small a context, then takes the first survivor. Design rules:
#   * quality x throughput first, but never spend scarce quota when a cheap
#     equal-quality pool is available;
#   * providers are INTERLEAVED so one provider's 429 doesn't stall the chain;
#   * every entry below is verified to do tool calling (agentic coding needs it);
#   * opencode Go entries use only HIGH-ALLOWANCE models (see table below) —
#     never kimi-k3 (110/5h), grok-4.5 (120), qwen3.8-max (160), glm-5.3 (220);
#   * Copilot premium is LAST: 300 requests/month is the scarcest resource.
#
# opencode Go requests per 5h per account (x2 accounts), from the Go dashboard:
#   ox-alpha-free INF | muse-spark 45,300 (needs data opt-in) | mimo-v2.5 30,100
#   hy3 4,300 (8x usage => ~34,400) | longcat-2.0 11,400 | deepseek-v4-flash 7,600
#   qwen3.7-plus 4,300 | minimax-m3 3,200 | kimi-k2.7-code 1,350 | glm-5.2 880
models = [
  # --- free frontier, zero cost, renewable ---
  "zenmux/z-ai/glm-5.3-free",                      # GLM-5.3 flagship, 1M ctx
  "openrouter/stealth/ox-alpha",                   # frontier agentic coder, 1M ctx, 20rpm/1000day
  "opencode-zen/hy3-free",                         # Hunyuan 3 (295B reasoning)

  # --- opencode Go subscriptions: unlimited / huge allowance models only ---
  "opencode-go-github/ox-alpha-free",              # INFINITE requests
  "opencode-go-google/ox-alpha-free",              # INFINITE requests
  "opencode-go-github/hy3",                        # ~34,400 effective / 5h
  "opencode-go-google/hy3",

  # --- other free renewables ---
  "ollama/gpt-oss:120b",                           # ollama cloud free tier
  "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free",  # 550B, 1M ctx
  "mistral/devstral-latest",                       # free Experiment tier, agentic coder
  "agnes/agnes-2.5-flash",                         # free flash tier

  # --- deeper Go fallbacks (still very high allowance) ---
  "opencode-go-github/deepseek-v4-flash",          # 7,600 / 5h
  "opencode-go-google/mimo-v2.5",                  # 30,100 / 5h

  # --- finite free packs (spend after renewables; alibaba expires ~Nov 2026) ---
  "tencent/glm-5.3",
  "alibaba/qwen3.8-max",

  # --- premium last: scarce, then the 0x model that never runs out ---
  "github/claude-sonnet-4.6",                      # 300 premium requests/month
  "github-free/gpt-5-mini",                        # 0x multiplier, unlimited floor
]

[launch]
model = "auto"
small_model = "github-free/gpt-5-mini"

# ---------------------------------------------------------------------------
# OAuth providers
# ---------------------------------------------------------------------------

# Copilot Pro (yearly): 300 premium requests/month, resets 1st 00:00 UTC, no
# rollover. Multipliers: sonnet 1x, haiku 0.33x, gpt-5-mini 0x (see
# github-free below). pxy counts plain requests, so 300 = sonnet-equivalents
# (haiku slightly overcounted). Context lengths from the live /models API
# (max_prompt_tokens governs what fits).
[providers.github]
kind = "github-copilot"
format = "openai"
credentials = { pass = "AI/github/main" }
models = [
  { id = "claude-sonnet-4.6", context_length = 200000, max_output_tokens = 64000 },
  { id = "claude-haiku-4.5", context_length = 128000, max_output_tokens = 32000 },
  { id = "gpt-5.4", context_length = 272000, max_output_tokens = 128000 },
  { id = "kimi-k2.7-code", context_length = 256000, max_output_tokens = 32000 },
]
[providers.github.limits]
monthly_requests = 300        # premium request allowance (Pro)
reset = "00:00"
reset_tz = "UTC"

# 0x-multiplier Copilot models: unlimited on paid plans, keep working even
# after the 300 premium requests are spent. Separate provider so their heavy
# background use never eats the premium budget in pxy's accounting.
[providers.github-free]
kind = "github-copilot"
format = "openai"
credentials = { pass = "AI/github/main" }
models = [
  { id = "gpt-5-mini", context_length = 128000, max_output_tokens = 64000 },
]

# ---------------------------------------------------------------------------
# API-key providers (base URLs from OmniRoute registry, docs/06)
# ---------------------------------------------------------------------------

# Tencent Cloud TokenHub (international, Singapore node) — OpenAI-compatible
# gateway. Key from the TokenHub console API Key page; each model must be
# ACTIVATED in the console Model Gallery first (else 402 "endpoint is
# inactive"). Each activated model carries its own 1M free token quota
# (valid 1 year); keep Pay-As-You-Go OFF so exhausted quota stops requests
# instead of billing. TokenHub also speaks Anthropic protocol on the same
# base URL. Note: pxy's total_tokens guard is per-provider; Tencent enforces
# quotas per-model.
[providers.tencent]
base_url = "https://tokenhub-intl.tencentcloudmaas.com/v1/chat/completions"
embeddings_url = "https://tokenhub-intl.tencentcloudmaas.com/v1/embeddings"
api_key = { pass = "AI/tencent/main" }
parse_think_tags = true
models = [
  "hy3",
  "glm-5.3",
  "kimi-k3",
  "deepseek-v4-pro-0813",
  "minimax-m3",
]
# vl-embedding models need a multimodal endpoint, not plain /v1/embeddings
embedding_models = ["kinfra-text-embedding-0.6b", "kinfra-text-embedding-4b"]
[providers.tencent.limits]
total_tokens = 5000000        # 5 activated models x 1M free quota

# Ollama Cloud — free plan ("light usage" rate limits, enforced upstream;
# 429s trigger pxy cooldown+failover). Key from ollama.com/settings/keys.
[providers.ollama]
base_url = "https://ollama.com/v1/chat/completions"
api_key = { pass = "AI/ollama/main" }
# Free plan includes ONLY these (probed 2026-08-24); glm/kimi/deepseek/
# minimax/qwen on ollama cloud need a paid subscription (403 otherwise).
models = [
  "gpt-oss:120b",
  "gpt-oss:20b",
  "nemotron-3-ultra",
  "nemotron-3-super",
  "nemotron-3-nano:30b",
  "gemma4:31b",
]

# UNUSABLE (commented out) — DeepSeek direct: balance $0.00 (checked via /user/balance, is_available
# false), so every call returns "Insufficient Balance". No free tier; they
# bill pay-as-you-go. Disabled until topped up — DeepSeek models are already
# reachable free via tencent/ollama/openrouter anyway.
# [providers.deepseek]
# base_url = "https://api.deepseek.com/chat/completions"
# api_key = { pass = "AI/deepseek/main" }
# models = [
#   { id = "deepseek-v4-flash", context_length = 128000 },
#   { id = "deepseek-v4-pro", context_length = 128000 },
# ]

# OpenRouter, FREE models only (":free" ids never consume credits — free-model
# caps are rate limits, not credit limits). Limits verified 2026-08-24:
# 20 req/min; 1000 free requests/day because >=$10 credits were purchased
# (accounts under $10 lifetime get only 50/day).
[providers.openrouter]
base_url = "https://openrouter.ai/api/v1/chat/completions"
api_key = { pass = "AI/openrouter/main" }
headers = { HTTP-Referer = "http://localhost", X-Title = "pxy" }
models = [
  # cloaked frontier model, free while in stealth (prompts likely used for training)
  { id = "stealth/ox-alpha", context_length = 1000000 },
  { id = "z-ai/glm-5.2:free", context_length = 256000 },
  { id = "cohere/north-mini-code:free", context_length = 256000 },
  { id = "poolside/laguna-s-2.1:free", context_length = 262144 },
  { id = "thinkingmachines/inkling:free", context_length = 262144 },
  { id = "nvidia/nemotron-3-super-120b-a12b:free", context_length = 262144 },
  { id = "nvidia/nemotron-3.5-lightning:free", context_length = 1000000 },
  { id = "nvidia/nemotron-3-ultra-550b-a55b:free", context_length = 1000000 },
  { id = "dots-studio/dots-3-note-preview:free", context_length = 512000 },
  { id = "google/gemma-4-31b-it:free", context_length = 262144 },
]
[providers.openrouter.limits]
rpm = 20
daily_requests = 1000
reset = "00:00"
reset_tz = "UTC"

# opencode Zen: pay-per-token gateway sharing the Go workspace key.
# The *-free models cost nothing (limited time; NVIDIA ones are trial-only —
# don't send personal data; muse-spark trains on prompts).
[providers.opencode-zen]
base_url = "https://opencode.ai/zen/v1/chat/completions"
api_key = { pass = "AI/opencode-go/github" }
models = [
  "big-pickle",
  "hy3-free",
  "deepseek-v4-flash-free",
  "mimo-v2.5-free",
  "x-preview-f-free",
  "nemotron-3-ultra-free",
  "nemotron-3.5-lightning-free",
  "laguna-s-2.1-free",
  "muse-spark-1.2-contributor-free",
]

# opencode Go ($10/mo sub per account): dollar-based limits enforced
# upstream — $12 per 5h window, $30/week, $60/month. Two accounts; pxy's
