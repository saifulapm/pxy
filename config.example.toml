kind = "jina"
api_key = { pass = "AI/jina-reader/main" }

[[search.providers]]
name = "firecrawl"
kind = "firecrawl-search"
api_key = { pass = "AI/firecrawl/main" }
monthly_requests = 200

# URL -> markdown. jina-reader first (big free quota), firecrawl fallback.
[[fetch.providers]]
