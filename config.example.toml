  "ox-alpha-free",
  "hy3",
  "mimo-v2.5",
  "deepseek-v4-flash",
  "longcat-2.0",
  "minimax-m3",
  "qwen3.7-plus",
  "kimi-k2.7-code",
  "glm-5.2",
  # Deliberately NOT in [auto] (tiny allowances): kimi-k3 110/5h,
  # grok-4.5 120, qwen3.8-max 160, glm-5.3 220.
  "kimi-k3",
  "glm-5.3",
]

[providers.opencode-go-google]
base_url = "https://opencode.ai/zen/go/v1/chat/completions"
api_key = { pass = "AI/opencode-go/google" }
models = [
  # High-allowance picks only (per-5h caps in the [auto] comment above).
  "ox-alpha-free",
  "hy3",
  "mimo-v2.5",
  "deepseek-v4-flash",
  "longcat-2.0",
  "minimax-m3",
  "qwen3.7-plus",
  "kimi-k2.7-code",
  "glm-5.2",
  # Deliberately NOT in [auto] (tiny allowances): kimi-k3 110/5h,
