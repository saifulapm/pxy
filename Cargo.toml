[package]
name = "pxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# flock() for the shared claude-oauth credential file (approved 2026-08-26)
libc = "0.2"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.22"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
jiff = "0.2.35"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream", "http2", "gzip", "multipart"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
